name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bats and shellcheck (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Install bats and shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck

      - name: Run checks
        env:
          # macOS ships bash 3.2 as /bin/bash; run the scripts under it there.
          JEF_BASH: ${{ runner.os == 'macOS' && '/bin/bash' || 'bash' }}
        run: ./scripts/check.sh
