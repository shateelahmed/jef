schema: spec-driven

# Project context: constraints an agent cannot infer by reading the code.
context: |
  jef is a set of plain Bash scripts (no build step, no package manager, no runtime other than bash + git).
  Must keep working on both macOS (bash 3.2 / BSD userland) and Linux (GNU userland); Windows is unsupported.
  Commands operate only on the first-level child directories of the target directory, never recursively.
  Every command must honour SKIP_DIRS and the -d/--directory override consistently with the existing commands.
  User-facing behaviour changes (new command, flag, or env var) must also update README.md and .env.example.
  Tests live in tests/ (bats-core) and run with ./scripts/check.sh (bash -n, shellcheck, bats); CI runs it on Linux and macOS.

rules:
  proposal:
    - State which jef commands are affected
    - State what is out of scope
  tasks:
    - Include a task to update README.md when user-facing behaviour changes

operations:
  apply:
    guidance:
      - Never create git commits; leave changes uncommitted for the user to review
      - Route and verify each task per AGENTS.md (cost check, cheapest suitable executor, verification)
  archive:
    guidance:
      - Never archive a change unless the user has explicitly asked to archive it
